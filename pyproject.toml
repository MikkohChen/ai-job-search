[build-system]
requires = ["setuptools>=77.0.3,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "car-job-search-runtime"
version = "1.0.0"
description = "Replaceable execution runtime for CAR career intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "PyYAML>=6.0.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
